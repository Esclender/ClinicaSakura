<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FerreteriaMas</title>
    <link rel="shortcut icon" type="image/png" th:href="@{/favicon.png}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/812c8ee19a.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'teal-primary': '#299D91',
                        'teal-hover': '#248A7F',
                        'dark-gray': '#64748b',
                        'light-gray': '#f8f9fa',
                        'text-dark': '#1f2937',
                        'text-light': '#6b7280'
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen flex items-center justify-center" style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);">

    <div class="w-full max-w-md p-8">
        <!-- Logo/Brand -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-inter font-semibold mb-2">
                <span style="color: #299D91;">Ferreteria</span><span style="color: #64748b;">Mas</span>
            </h1>
        </div>

        <!-- Login Form Container -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <!-- Error Alert -->
            <div th:if="${param.error}" class="flex items-center p-4 mb-6 text-red-700 bg-red-50 rounded-lg border border-red-200" role="alert">
                <svg class="flex-shrink-0 w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                </svg>
                <span class="font-medium">Invalid credentials!</span>
                <button type="button" th:onclick="'window.location.href=\'' + @{/login} + '\''" class="ml-auto -mx-1.5 -my-1.5 bg-red-50 text-red-500 rounded-lg p-1.5 hover:bg-red-100">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <form th:action="@{/login}" method="post" class="space-y-6">
                <!-- Email Address Field -->
                <div>
                    <label for="loginUsuario" class="block text-sm font-medium mb-2" style="color: #64748b;">Email Address</label>
                    <input type="text" 
                           id="loginUsuario" 
                           name="username"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-primary focus:border-transparent transition-all duration-200 font-inter"
                           placeholder="john@doe@email.com"
                           style="background-color: #ffffff; color: #1f2937;"
                           required>
                </div>

                <!-- Password Field -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="loginPassword" class="block text-sm font-medium" style="color: #64748b;">Password</label>
                        <a href="#" class="text-sm font-medium" style="color: #299D91;" onmouseover="this.style.color='#248A7F'" onmouseout="this.style.color='#299D91'">Forgot Password?</a>
                    </div>
                    <div class="relative">
                        <input type="password" 
                               id="loginPassword" 
                               name="password"
                               class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-primary focus:border-transparent transition-all duration-200 font-inter pr-12"
                               placeholder="••••••••••••"
                               style="background-color: #ffffff; color: #1f2937;"
                               required>
                        <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center" onclick="togglePassword()">
                            <i id="eyeIcon" class="fas fa-eye" style="color: #6b7280;"></i>
                        </button>
                    </div>
                </div>

                <!-- Keep me signed in -->
                <div class="flex items-center">
                    <input type="checkbox" id="keepSignedIn" class="h-4 w-4 rounded border-gray-300 focus:ring-teal-primary" style="accent-color: #299D91;">
                    <label for="keepSignedIn" class="ml-2 text-sm font-medium" style="color: #64748b;">Keep me signed in</label>
                </div>

                <!-- Login Button -->
                <button type="submit" 
                        class="w-full py-3 px-4 rounded-lg font-medium font-inter text-white transition-all duration-200 transform hover:scale-[1.02] focus:ring-4 focus:ring-teal-primary focus:ring-opacity-50"
                        style="background-color: #299D91;"
                        onmouseover="this.style.backgroundColor='#248A7F'" 
                        onmouseout="this.style.backgroundColor='#299D91'">
                    Login
                </button>

                <!-- Divider -->
                <div class="text-center text-sm" style="color: #6b7280;">
                    or sign in with
                </div>

                <!-- Create Account Link -->
                <div class="text-center">
                    <a href="#" class="text-sm font-medium" style="color: #299D91;" onmouseover="this.style.color='#248A7F'" onmouseout="this.style.color='#299D91'">
                        Create an account
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('loginPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Add focus effects
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input[type="text"], input[type="password"]');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.style.boxShadow = '0 0 0 3px rgba(41, 157, 145, 0.1)';
                });
                input.addEventListener('blur', function() {
                    this.style.boxShadow = 'none';
                });
            });
        });
    </script>
</body>

</html>
