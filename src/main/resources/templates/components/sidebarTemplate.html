<section class="block" th:fragment="sidebar(selectedPage)">
  <div class="fixed sidebar w-64 h-screen bg-gray-900 border-r border-gray-700 flex flex-col">
    
    <!-- Header/Logo Section -->
    <div class="px-6 py-6 border-b border-gray-700">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 bg-teal-500 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-sm">FM</span>
        </div>
        <span class="text-white font-semibold text-lg">FerreteriaMas</span>
      </div>
    </div>

    <!-- Main Navigation -->
    <nav class="flex-1 px-4 py-6 space-y-2">
      
      <!-- Dashboard/Inicio -->
      <a th:href="@{/inicio}" 
         th:class="${selectedPage==1 ? 'bg-teal-600 text-white rounded-lg px-3 py-3 flex items-center space-x-3 font-medium transition-colors' : 'text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg px-3 py-3 flex items-center space-x-3 font-medium transition-colors'}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5a2 2 0 012-2h4a2 2 0 012 2v0M8 5a2 2 0 012-2h4a2 2 0 012 2v0"/>
        </svg>
        <span>Dashboard</span>
      </a>

      <!-- Almacén -->
      <a th:href="@{/productos}" 
         th:class="${selectedPage==2 ? 'bg-teal-600 text-white rounded-lg px-3 py-3 flex items-center space-x-3 font-medium transition-colors' : 'text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg px-3 py-3 flex items-center space-x-3 font-medium transition-colors'}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
        <span>Almacén</span>
      </a>

      <!-- Proveedores -->
      <a th:href="@{/proveedor}" 
         th:class="${selectedPage==3 ? 'bg-teal-600 text-white rounded-lg px-3 py-3 flex items-center space-x-3 font-medium transition-colors' : 'text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg px-3 py-3 flex items-center space-x-3 font-medium transition-colors'}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M8 6l4-4 4 4v4H8V6z"/>
        </svg>
        <span>Proveedores</span>
      </a>

      <!-- Empleados -->
      <a th:href="@{/empleados}" 
         th:class="${selectedPage==4 ? 'bg-teal-600 text-white rounded-lg px-3 py-3 flex items-center space-x-3 font-medium transition-colors' : 'text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg px-3 py-3 flex items-center space-x-3 font-medium transition-colors'}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/>
        </svg>
        <span>Empleados</span>
      </a>

      <!-- Optional: Inventory Movements (commented out) -->

      <div class="pt-4 border-t border-gray-700">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Movimientos</p>
        
        <a th:href="@{/entrada}" 
           th:class="${selectedPage==5 ? 'bg-teal-600 text-white rounded-lg px-3 py-3 flex items-center space-x-3 font-medium transition-colors' : 'text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg px-3 py-3 flex items-center space-x-3 font-medium transition-colors'}">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          <span>Entradas</span>
        </a>

        <a th:href="@{/salida}" 
           th:class="${selectedPage==6 ? 'bg-teal-600 text-white rounded-lg px-3 py-3 flex items-center space-x-3 font-medium transition-colors' : 'text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg px-3 py-3 flex items-center space-x-3 font-medium transition-colors'}">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/>
          </svg>
          <span>Salidas</span>
        </a>
      </div>
      -->
    </nav>

    <!-- User Profile & Logout Section -->
    <div class="border-t border-gray-700 p-4">
      <!-- User Profile -->
      <div class="flex items-center space-x-3 mb-4">
        <div class="w-8 h-8 bg-gray-600 rounded-full flex items-center justify-center">
          <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-white truncate">Administrador</p>
          <p class="text-xs text-gray-400 truncate">Sistema FerreteriaMas</p>
        </div>
      </div>

      <!-- Logout Button -->
      <form th:action="@{/logout}" method="post" class="w-full">
        <button type="submit" class="w-full text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg px-3 py-2 flex items-center space-x-3 font-medium transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          <span>Logout</span>
        </button>
      </form>
    </div>
  </div>
</section>
